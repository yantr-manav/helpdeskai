version: "3.9"

services:
  # ─── Vector DB ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: flowtask_qdrant
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (session store) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flowtask_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowtask_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ─── Seed job (runs once) ─────────────────────────────────────
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowtask_seed
    command: python scripts/seed_kb.py
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
    profiles:
      - seed

volumes:
  qdrant_data:
  redis_data:
